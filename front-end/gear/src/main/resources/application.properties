spring.datasource.url=jdbc:postgresql://db:5432/cicd
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
server.port=8081

# Expose only health + prometheus over HTTP (Actuator hides the rest by default).
management.endpoints.web.exposure.include=health,prometheus
# Split health into liveness/readiness groups so K8s probes can hit them.
management.endpoint.health.probes.enabled=true
