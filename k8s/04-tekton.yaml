apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: tekton-custom-resources
spec:
  params:
    - name: url
      type: string

    - name: revision
      type: string
      default: main

  workspaces:
    - name: source

  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        #!/bin/sh
        set -eu

        rm -rf $(workspaces.source.path)/*

        git clone \
          --branch "$(params.revision)" \
          "$(params.url)" \
          "$(workspaces.source.path)"

---

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-build
  namespace: tekton-custom-resources
spec:
  workspaces:
    - name: source

  steps:
    - name: build
      image: maven:3.9-eclipse-temurin-25
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -eu

        mvn clean package -DskipTests

---

apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: spring-pipeline
  namespace: tekton-custom-resources
spec:
  workspaces:
    - name: source

  params:
    - name: git-url
      type: string

    - name: git-revision
      type: string
      default: main

  tasks:

    - name: clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: tekton-custom-resources

      params:
        - name: url
          value: $(params.git-url)

        - name: revision
          value: $(params.git-revision)

      workspaces:
        - name: source
          workspace: source

    - name: build
      runAfter:
        - clone

      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: maven-build
          - name: namespace
            value: tekton-custom-resources

      workspaces:
        - name: source
          workspace: source
