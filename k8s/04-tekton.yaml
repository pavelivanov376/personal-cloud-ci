apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: url
      type: string

    - name: revision
      type: string
      default: main

  workspaces:
    - name: source

  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        #!/bin/sh
        set -eu

        rm -rf $(workspaces.source.path)/*

        git clone \
          --branch "$(params.revision)" \
          "$(params.url)" \
          "$(workspaces.source.path)"

---

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-build
spec:
  workspaces:
    - name: source

  steps:
    - name: build
      image: maven:3.9-eclipse-temurin-25
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -eu

        mvn clean package -DskipTests

---

apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: spring-pipeline
spec:
  workspaces:
    - name: source

  params:
    - name: git-url
      type: string

    - name: git-revision
      type: string
      default: main

  tasks:

    - name: clone
      taskRef:
        name: git-clone

      params:
        - name: url
          value: $(params.git-url)

        - name: revision
          value: $(params.git-revision)

      workspaces:
        - name: source
          workspace: source

    - name: build
      runAfter:
        - clone

      taskRef:
        name: maven-build

      workspaces:
        - name: source
          workspace: source

---
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: spring-build-run-5
spec:
  pipelineRef:
    name: spring-pipeline

  params:
    - name: git-url
      value: https://github.com/pavelivanov376/ci-cd-service

    - name: git-revision
      value: main

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: hostpath
          resources:
            requests:
              storage: 1Gi
