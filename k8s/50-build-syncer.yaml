apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-syncer
  namespace: cicloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-syncer
  namespace: cicloud
rules:
  - apiGroups: ["steward.sap.com"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-syncer
  namespace: cicloud
subjects:
  - kind: ServiceAccount
    name: build-syncer
    namespace: cicloud
roleRef:
  kind: Role
  name: build-syncer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-syncer
  namespace: cicloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: build-syncer
  template:
    metadata:
      labels:
        app: build-syncer
    spec:
      serviceAccountName: build-syncer
      containers:
        - name: build-syncer
          image: personalcicloud/build-syncer:local
          imagePullPolicy: IfNotPresent
          env:
            - name: GEAR_URL
              value: http://gear:8081
            - name: POLL_INTERVAL
              value: 10s
            - name: PIPELINERUN_NAMESPACE
              value: cicloud
