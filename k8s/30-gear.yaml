apiVersion: apps/v1
kind: Deployment
metadata:
  name: gear
  namespace: cicloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gear
  template:
    metadata:
      labels:
        app: gear
    spec:
      containers:
        - name: gear
          image: personalcicloud/gear:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db:5432/cicd
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: gear
  namespace: cicloud
spec:
  selector:
    app: gear
  ports:
    - name: http
      port: 8081
      targetPort: 8081
