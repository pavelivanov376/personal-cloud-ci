apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: cicloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: personalcicloud/ui:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: destinations
              value: '[{"name":"api-service","url":"http://api-service:8080"}]'
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: cicloud
spec:
  type: NodePort
  selector:
    app: ui
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30500
