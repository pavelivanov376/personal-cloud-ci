# Bumped by start.sh on every deploy (--set rollDate=...) so `helm upgrade`
# always rolls the app Deployments — the Helm equivalent of `rollout restart`.
# Left empty here; templates fall back to `now` if unset.
rollDate: ""

namespaces:
  app: cicloud
  tekton: tekton-custom-resources

# ServiceMonitors carry this as their `release` label so the kube-prometheus-stack
# Prometheus (installed with release name `monitoring`) selects them. Must equal
# that release name — see CLAUDE.md.
monitoring:
  releaseLabel: monitoring

db:
  image: postgres:16
  storage: 1Gi
  port: 5432
  credentials:
    user: postgres
    password: postgres
    database: cicd
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

apiService:
  image:
    repository: personalcicloud/api-service
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

gear:
  image:
    repository: personalcicloud/gear
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

ui:
  image:
    repository: personalcicloud/ui
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  port: 5000
  nodePort: 30500
  destinations: '[{"name":"api-service","url":"http://api-service:8080"}]'
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

buildSyncer:
  image:
    repository: personalcicloud/build-syncer
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  metricsPort: 9090
  env:
    gearUrl: http://gear:8081
    pollInterval: 10s
    pipelineRunNamespace: cicloud
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

segton:
  image:
    repository: personalcicloud/segton
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  metricsPort: 9090
  env:
    segtonNamespace: cicloud
    pipelineNamespace: tekton-custom-resources
    pipelineName: spring-pipeline
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

tekton:
  gitImage: alpine/git:latest
  mavenImage: maven:3.9-eclipse-temurin-25
  defaultRevision: main
