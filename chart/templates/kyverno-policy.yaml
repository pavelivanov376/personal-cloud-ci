{{- /*
This file mixes two templating layers that share the same delimiters:
  - Helm variables (.Values.x) are rendered on `helm install`, before the cluster.
  - Kyverno expressions (element.resources...) must survive Helm untouched and be
    evaluated in-cluster at admission time.
Kyverno expressions are wrapped in Helm backtick-literal blocks below so Helm emits
them verbatim instead of trying to execute them. This is a Helm template comment
({{- /* ... *​/ -}}), which — unlike a YAML # comment — Helm strips before parsing,
so it can safely describe the delimiters without triggering them.
*/ -}}
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: require-memory-limit-max-2gi
  namespace: {{ .Values.namespaces.app }}
spec:
  validationFailureAction: Enforce
  background: true                     # also scan existing pods, not just new ones
  rules:
    - name: memory-limit-required-and-capped
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Every container must set resources.limits.memory and it must not exceed 2Gi."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  # fail if no memory limit is set...
                  - key: {{ `"{{ element.resources.limits.memory || '' }}"` }}
                    operator: Equals
                    value: ""
                  # ...or if the limit exceeds 2Gi
                  - key: {{ `"{{ element.resources.limits.memory }}"` }}
                    operator: GreaterThan
                    value: "2Gi"
---
# Disallow the mutable :latest tag and untagged images
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: disallow-latest-tag
  namespace: {{ .Values.namespaces.app }}
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-explicit-non-latest-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Images must use an explicit tag other than ':latest'."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  # no tag at all (image has no ":")
                  - key: {{ `"{{ regex_match('^[^:]+$', element.image) }}"` }}
                    operator: Equals
                    value: true
                  # explicit :latest
                  - key: {{ `"{{ regex_match('.*:latest$', element.image) }}"` }}
                    operator: Equals
                    value: true
---
# Require containers to declare runAsNonRoot=true at pod or container level.
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: require-run-as-non-root
  namespace: {{ .Values.namespaces.app }}
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: run-as-non-root-required
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Containers must set securityContext.runAsNonRoot=true (at pod or container level)."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  # container does not opt in...
                  - key: {{ `"{{ element.securityContext.runAsNonRoot || 'unset' }}"` }}
                    operator: NotEquals
                    value: true
                  # ...and neither does the pod
                  - key: {{ `"{{ request.object.spec.securityContext.runAsNonRoot || 'unset' }}"` }}
                    operator: NotEquals
                    value: true