apiVersion: v1
kind: ServiceAccount
metadata:
  name: segton
  namespace: {{ .Values.namespaces.app }}
---
# Namespace-scoped: read + patch SegtonPipelineRuns in cicloud.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: segton
  namespace: {{ .Values.namespaces.app }}
rules:
  - apiGroups: ["segton.sap.com"]
    resources: ["segtonpipelineruns"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: segton
  namespace: {{ .Values.namespaces.app }}
subjects:
  - kind: ServiceAccount
    name: segton
    namespace: {{ .Values.namespaces.app }}
roleRef:
  kind: Role
  name: segton
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-scoped: create namespaces (segton-run-*) and Tekton PipelineRuns
# in arbitrary namespaces, plus watch them cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: segton
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: segton
subjects:
  - kind: ServiceAccount
    name: segton
    namespace: {{ .Values.namespaces.app }}
roleRef:
  kind: ClusterRole
  name: segton
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: segton
  namespace: {{ .Values.namespaces.app }}
spec:
  replicas: {{ .Values.segton.replicas }}
  selector:
    matchLabels:
      app: segton
  template:
    metadata:
      labels:
        app: segton
      annotations:
        {{- include "cicloud.rollAnnotation" . | nindent 8 }}
    spec:
      serviceAccountName: segton
      containers:
        - name: segton
          image: {{ .Values.segton.image.repository }}:{{ .Values.segton.image.tag }}
          imagePullPolicy: {{ .Values.segton.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.segton.metricsPort }}
          resources:
            {{- toYaml .Values.segton.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.segton.metricsPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: SEGTON_NAMESPACE
              value: {{ .Values.segton.env.segtonNamespace }}
            - name: PIPELINE_NAMESPACE
              value: {{ .Values.segton.env.pipelineNamespace }}
            - name: PIPELINE_NAME
              value: {{ .Values.segton.env.pipelineName }}
---
apiVersion: v1
kind: Service
metadata:
  name: segton
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: segton   # ServiceMonitor.selector matches on the Service's own labels
spec:
  selector:
    app: segton
  ports:
    - name: metrics
      port: {{ .Values.segton.metricsPort }}
      targetPort: metrics
