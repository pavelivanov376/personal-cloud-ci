apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: {{ .Values.namespaces.tekton }}
spec:
  params:
    - name: url
      type: string

    - name: revision
      type: string
      default: {{ .Values.tekton.defaultRevision }}

  workspaces:
    - name: source

  steps:
    - name: clone
      image: {{ .Values.tekton.gitImage }}
      script: |
        #!/bin/sh
        set -eu

        rm -rf $(workspaces.source.path)/*

        git clone \
          --branch "$(params.revision)" \
          "$(params.url)" \
          "$(workspaces.source.path)"

---

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-build
  namespace: {{ .Values.namespaces.tekton }}
spec:
  workspaces:
    - name: source

  steps:
    - name: build
      image: {{ .Values.tekton.mavenImage }}
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -eu

        mvn clean package -DskipTests

---

apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: {{ .Values.segton.env.pipelineName }}
  namespace: {{ .Values.namespaces.tekton }}
spec:
  workspaces:
    - name: source

  params:
    - name: git-url
      type: string

    - name: git-revision
      type: string
      default: {{ .Values.tekton.defaultRevision }}

  tasks:

    - name: clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: {{ .Values.namespaces.tekton }}

      params:
        - name: url
          value: $(params.git-url)

        - name: revision
          value: $(params.git-revision)

      workspaces:
        - name: source
          workspace: source

    - name: build
      runAfter:
        - clone

      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: maven-build
          - name: namespace
            value: {{ .Values.namespaces.tekton }}

      workspaces:
        - name: source
          workspace: source
