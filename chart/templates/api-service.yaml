apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: {{ .Values.namespaces.app }}
spec:
  replicas: {{ .Values.apiService.replicas }}
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
      annotations:
        {{- include "cicloud.rollAnnotation" . | nindent 8 }}
    spec:
      containers:
        - name: api-service
          image: {{ .Values.apiService.image.repository }}:{{ .Values.apiService.image.tag }}
          imagePullPolicy: {{ .Values.apiService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.apiService.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db:{{ .Values.db.port }}/{{ .Values.db.credentials.database }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: {{ .Values.namespaces.app }}
spec:
  selector:
    app: api-service
  ports:
    - name: http
      port: {{ .Values.apiService.port }}
      targetPort: {{ .Values.apiService.port }}
